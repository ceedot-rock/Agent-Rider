name: Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Placeholder env so lib/stripe.ts and lib/db.ts don't throw at module
    # load during `next build`. Rider keys are generated in a prior step
    # and never committed. Do not put a real issuer key here.
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      BADGE_SECRET: ci-placeholder-badge-secret
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder

    steps:
    - uses: actions/checkout@v4

    - name: Generate CI-only rider keypair
      run: |
        openssl ecparam -name prime256v1 -genkey -noout -out /tmp/ci-ec.pem
        openssl pkcs8 -topk8 -nocrypt -in /tmp/ci-ec.pem -out /tmp/ci-priv.pem
        openssl ec -in /tmp/ci-ec.pem -pubout -out /tmp/ci-pub.pem
        {
          echo "RIDER_PRIVATE_KEY<<EOF"
          cat /tmp/ci-priv.pem
          echo "EOF"
          echo "RIDER_PUBLIC_KEY<<EOF"
          cat /tmp/ci-pub.pem
          echo "EOF"
        } >> "$GITHUB_ENV"
        rm -f /tmp/ci-ec.pem /tmp/ci-priv.pem /tmp/ci-pub.pem

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/package-lock.json

    - name: Install dependencies
      working-directory: src
      run: npm ci

    - name: Build
      working-directory: src
      run: npm run build
