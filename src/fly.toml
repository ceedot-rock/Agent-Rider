app = "agentrider"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  NEXT_PUBLIC_SITE_URL = "https://agentrider.fly.dev"
  VERIFY_FREE_CALLS_PER_MONTH = "69"
  TASK_FEE_RATE = "0.05"
  CREDITS_PER_USD = "100"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
